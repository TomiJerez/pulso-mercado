<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulso del Mercado — en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#F1F3F5; --surface:#FFFFFF; --surface-2:#E9EDF1;
    --ink:#1B2430; --ink-muted:#5B6672; --ink-faint:#8A94A0; --border:#D8DEE4;
    --up:#1E8F5C; --down:#B5562D; --accent:#3468A8; --accent-bg:#E6EEF6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{overflow-y:auto}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Public Sans', system-ui, sans-serif;
    padding:16px 16px 28px; display:flex; flex-direction:column; gap:14px}
  h1{font-family:'Fraunces', Georgia, serif; font-size:1.25rem; font-weight:600; margin:0}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
  .titlewrap{display:flex; flex-direction:column; gap:3px}
  .asof{font-size:.72rem; color:var(--ink-faint); display:flex; align-items:center; gap:6px}
  .dot-live{width:6px;height:6px;border-radius:50%;background:var(--up);animation:pulse 2s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){.dot-live{animation:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .range-toggle{display:flex; gap:2px; background:var(--border); border-radius:9px; padding:2px}
  .range-toggle button{border:none; background:transparent; color:var(--ink-muted); font-family:'Public Sans',sans-serif;
    font-size:.82rem; font-weight:600; padding:7px 16px; border-radius:7px; cursor:pointer}
  .range-toggle button.active{background:var(--surface); color:var(--ink)}
  .grid{display:flex; flex-wrap:wrap; gap:8px; flex:1; align-content:flex-start; min-height:0}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:7px 10px 6px; display:flex; flex-direction:column; min-height:92px; flex:1 1 215px; min-width:0}
  .card .hd{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
  .tk{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.82rem}
  .nm{font-size:.58rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em}
  .px{font-family:'IBM Plex Mono',monospace; font-size:.74rem; font-weight:600}
  .chg{font-family:'IBM Plex Mono',monospace; font-size:.68rem; font-weight:600}
  .chg.up{color:var(--up)} .chg.down{color:var(--down)}
  .chartwrap{flex:1; min-height:48px}
  svg{width:100%; height:100%; display:block; overflow:visible}
  .chartwrap svg{transition:opacity .18s ease}
  body.resizing .chartwrap svg{opacity:0 !important; transition:none}
  svg text{font-family:'IBM Plex Mono',monospace; fill:var(--ink-faint)}
  .note{font-size:.62rem; color:var(--ink-faint); font-style:italic}
  .sectiontag{font-size:.66rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); flex-basis:100%; margin-top:6px}
  .sectiontag:first-child{margin-top:0}
  footer{font-size:.68rem; color:var(--ink-faint); display:flex; gap:14px; flex-wrap:wrap}
  footer a{color:var(--ink-muted)}
</style>
</head>
<body>

  <div class="topbar">
    <div class="titlewrap">
      <h1>Pulso del mercado</h1>
      <div class="asof"><span class="dot-live"></span><span id="asof">cargando…</span></div>
    </div>
    <div class="range-toggle" id="rangeToggle">
      <button data-range="diario" class="active">Diario</button>
      <button data-range="mensual">Mensual</button>
      <button data-range="anual">Anual</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <span>Fuente: <a href="https://data912.com">data912.com</a> (API pública)</span>
    <span>Precio actual se refresca cada 30s</span>
    <span>ON: sin historia gratuita disponible — el gráfico se arma solo, día a día, desde hoy</span>
    <span><a href="https://github.com/TomiJerez/pulso-mercado">código fuente</a></span>
  </footer>

<script>
const CEDEAR = [
  {sym:'MELI', tk:'MELI', nm:''},
  {sym:'NVDA', tk:'NVDA', nm:''},
  {sym:'AMD',  tk:'AMD',  nm:''},
  {sym:'TSLA', tk:'TSLA', nm:'plan B'},
  {sym:'META', tk:'META', nm:'plan B'},
  {sym:'AMZN', tk:'AMZN', nm:'plan B'},
];
const ON = [
  {sym:'YMCXD', tk:'YMCX', nm:'YPF'},
  {sym:'VSCTD', tk:'VSCT', nm:'Vista Energy'},
  {sym:'TSC4D', tk:'TSC4', nm:'TGS'},
  {sym:'BACHD', tk:'BACH', nm:'Banco Macro'},
  {sym:'MGCOD', tk:'MGCO', nm:'Pampa · plan B'},
  {sym:'BYCHD', tk:'BYCH', nm:'Galicia · plan B'},
];
const RANGE_DAYS = { diario: 30, mensual: 180, anual: 365 };
let currentRange = 'diario';
let cedearHistory = {};   // sym -> [{date, c}]
let onLocalSeries = {};   // sym -> [{date, c}]  (built via localStorage, from today onward)
let liveQuotes = {};      // sym -> current quote

function buildGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  grid.insertAdjacentHTML('beforeend', '<div class="sectiontag">Trading activo · CEDEARs</div>');
  CEDEAR.forEach(item => grid.insertAdjacentHTML('beforeend', cardHTML(item)));
  grid.insertAdjacentHTML('beforeend', '<div class="sectiontag">Núcleo dolarizado · ON</div>');
  ON.forEach(item => grid.insertAdjacentHTML('beforeend', cardHTML(item)));
}
function cardHTML(item){
  return `<div class="card" id="card-${item.sym}">
    <div class="hd">
      <span class="tk">${item.tk}<div class="nm">${item.nm}</div></span>
      <div style="text-align:right">
        <div class="px" id="px-${item.sym}">—</div>
        <div class="chg" id="chg-${item.sym}">—</div>
      </div>
    </div>
    <div class="chartwrap" id="chart-${item.sym}"></div>
  </div>`;
}

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtAxisPrice(v){
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(1).replace('.', ',') + 'k';
  return (v < 10 ? v.toFixed(2) : Math.round(v)).toString();
}
function fmtAxisDate(dstr){
  const d = new Date(dstr + 'T00:00:00');
  return d.getDate() + ' ' + MESES[d.getMonth()];
}

const PAD = {L:30, R:3, T:9, B:11};
const FLOOR = 1e6; // far off-screen "price" so the area fill's bottom edge always clips outside the visible window
let cardDims = {};      // sym -> {W,H,IW,IH}
let currentBox = {};    // sym -> [x0,y0,w,h] last shown, for animating FROM
let animHandle = {};    // sym -> requestAnimationFrame id

function ensureCardSvg(sym){
  const wrap = document.getElementById('chart-' + sym);
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();
  const W = Math.max(rect.width, 100), H = Math.max(rect.height, 44);
  const IW = W - PAD.L - PAD.R, IH = H - PAD.T - PAD.B;
  cardDims[sym] = {W,H,IW,IH};
  wrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">
      <line x1="${PAD.L}" y1="${PAD.T}" x2="${W-PAD.R}" y2="${PAD.T}" stroke="var(--border)" stroke-width="1" stroke-dasharray="1.5,2"/>
      <line x1="${PAD.L}" y1="${PAD.T+IH}" x2="${W-PAD.R}" y2="${PAD.T+IH}" stroke="var(--border)" stroke-width="1"/>
      <text id="lblmax-${sym}" x="2" y="${PAD.T+3}" font-size="7.5"></text>
      <text id="lblmin-${sym}" x="2" y="${PAD.T+IH+3}" font-size="7.5"></text>
      <text id="lbld0-${sym}" x="${PAD.L}" y="${H-1}" font-size="6.5"></text>
      <text id="lbld1-${sym}" x="${W-PAD.R}" y="${H-1}" font-size="6.5" text-anchor="end"></text>
      <text id="lblempty-${sym}" x="${PAD.L+IW/2}" y="${PAD.T+IH/2-6}" text-anchor="middle" font-size="${Math.min(Math.max(IH*0.09,11),15)}" fill="var(--ink-muted)" opacity="0">sin historial gratuito</text>
      <text id="lblempty2-${sym}" x="${PAD.L+IW/2}" y="${PAD.T+IH/2+12}" text-anchor="middle" font-size="${Math.min(Math.max(IH*0.075,9),12)}" opacity="0">se arma solo, día a día, desde hoy</text>
      <svg id="inner-${sym}" x="${PAD.L}" y="${PAD.T}" width="${Math.max(IW,1)}" height="${Math.max(IH,1)}" viewBox="0 0 1 1" preserveAspectRatio="none" style="overflow:hidden">
        <path id="area-${sym}" fill-opacity=".08" stroke="none" d=""/>
        <path id="line-${sym}" fill="none" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" d=""/>
        <circle id="dot-${sym}" r="2.2" opacity="0"/>
      </svg>
    </svg>`;
  currentBox[sym] = null;
}

// Draws the full stable path (index-based x, -price as y) — the SAME path for every zoom level.
// Only the inner <svg>'s viewBox changes between Diario/Mensual/Anual, which is what produces the zoom.
function setSeries(sym, points){
  const n = points ? points.length : 0;
  const emptyLbl = document.getElementById('lblempty-' + sym);
  const emptyLbl2 = document.getElementById('lblempty2-' + sym);
  const lineEl = document.getElementById('line-' + sym);
  const areaEl = document.getElementById('area-' + sym);
  const dotEl = document.getElementById('dot-' + sym);
  if (!lineEl) return;
  if (n < 2){
    lineEl.setAttribute('d', ''); areaEl.setAttribute('d', ''); dotEl.setAttribute('opacity', '0');
    if (emptyLbl) emptyLbl.setAttribute('opacity', '1');
    if (emptyLbl2) emptyLbl2.setAttribute('opacity', '1');
    return;
  }
  if (emptyLbl) emptyLbl.setAttribute('opacity', '0');
  if (emptyLbl2) emptyLbl2.setAttribute('opacity', '0');
  const d = points.map((p,i) => `${i===0?'M':'L'}${i},${(-p.c).toFixed(4)}`).join(' ');
  const areaD = d + ` L${n-1},${FLOOR} L0,${FLOOR} Z`;
  lineEl.setAttribute('d', d);
  areaEl.setAttribute('d', areaD);
  const last = points[n-1].c, first = points[0].c;
  const color = last >= first ? 'var(--up)' : 'var(--down)';
  lineEl.setAttribute('stroke', color);
  areaEl.setAttribute('fill', color);
  dotEl.setAttribute('cx', n-1);
  dotEl.setAttribute('cy', (-last).toFixed(4));
  dotEl.setAttribute('fill', color);
  dotEl.setAttribute('opacity', '1');
}

function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

function animateViewBox(sym, toBox){
  const el = document.getElementById('inner-' + sym);
  if (!el) return;
  const fromBox = currentBox[sym] || toBox;
  if (animHandle[sym]) cancelAnimationFrame(animHandle[sym]);
  const dur = 500, start = performance.now();
  function frame(now){
    const t = Math.min((now - start) / dur, 1);
    const e = easeInOutCubic(t);
    const v = fromBox.map((f,i) => f + (toBox[i] - f) * e);
    el.setAttribute('viewBox', v.join(' '));
    if (t < 1) animHandle[sym] = requestAnimationFrame(frame);
  }
  animHandle[sym] = requestAnimationFrame(frame);
  currentBox[sym] = toBox;
}

function applyRange(sym, points){
  const n = points ? points.length : 0;
  if (n < 2) return;
  const days = Math.min(RANGE_DAYS[currentRange], n);
  const x0 = n - days;
  const slice = points.slice(x0);
  const vals = slice.map(p => p.c);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max){ min -= 1; max += 1; }
  const pad = (max - min) * 0.12;
  const toBox = [x0, -(max+pad), Math.max(days-1, 0.001), (max-min) + pad*2];
  document.getElementById('lblmax-'+sym).textContent = fmtAxisPrice(max);
  document.getElementById('lblmin-'+sym).textContent = fmtAxisPrice(min);
  document.getElementById('lbld0-'+sym).textContent = fmtAxisDate(slice[0].date);
  document.getElementById('lbld1-'+sym).textContent = fmtAxisDate(slice[slice.length-1].date);
  animateViewBox(sym, toBox);
}

function renderAll(){
  [...CEDEAR, ...ON].forEach(item => {
    if (!cardDims[item.sym]) ensureCardSvg(item.sym);
    const series = cedearHistory[item.sym] || onLocalSeries[item.sym] || [];
    setSeries(item.sym, series);
    applyRange(item.sym, series);
  });
}

function updateLiveLabels(){
  [...CEDEAR, ...ON].forEach(item => {
    const q = liveQuotes[item.sym];
    const pxEl = document.getElementById('px-' + item.sym);
    const chgEl = document.getElementById('chg-' + item.sym);
    if (!q || !pxEl) return;
    pxEl.textContent = '$' + Math.round(q.c).toLocaleString('es-AR');
    const pct = q.pct_change ?? 0;
    chgEl.textContent = (pct>=0?'+':'−') + Math.abs(pct).toFixed(2) + '%';
    chgEl.className = 'chg ' + (pct>=0?'up':'down');
  });
}

// ON: build a local, growing history in localStorage since no free API has it
function updateOnLocalSeries(){
  const todayKey = new Date().toISOString().slice(0,10);
  ON.forEach(item => {
    const q = liveQuotes[item.sym];
    if (!q) return;
    const storeKey = 'pulso_on_' + item.sym;
    let series = JSON.parse(localStorage.getItem(storeKey) || '[]');
    const last = series[series.length - 1];
    if (last && last.date === todayKey){
      last.c = q.c; // update today's point
    } else {
      series.push({date: todayKey, c: q.c});
    }
    if (series.length > 400) series = series.slice(-400);
    localStorage.setItem(storeKey, JSON.stringify(series));
    onLocalSeries[item.sym] = series;
  });
}

async function fetchLive(){
  try{
    const [corpRes, cedRes] = await Promise.all([
      fetch('https://data912.com/live/arg_corp'),
      fetch('https://data912.com/live/arg_cedears')
    ]);
    const corp = await corpRes.json();
    const ced = await cedRes.json();
    liveQuotes = {};
    [...corp, ...ced].forEach(q => liveQuotes[q.symbol] = q);
    updateOnLocalSeries();
    updateLiveLabels();
    renderAll();
    document.getElementById('asof').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR');
  }catch(e){
    document.getElementById('asof').textContent = 'Error al actualizar — reintentando…';
  }
}

async function fetchHistory(){
  await Promise.all(CEDEAR.map(async item => {
    try{
      const res = await fetch('https://data912.com/historical/cedears/' + item.sym);
      const data = await res.json();
      cedearHistory[item.sym] = data.map(d => ({date: d.date, c: d.c}));
    }catch(e){ cedearHistory[item.sym] = []; }
  }));
  ON.forEach(item => {
    onLocalSeries[item.sym] = JSON.parse(localStorage.getItem('pulso_on_' + item.sym) || '[]');
  });
  renderAll();
}

document.getElementById('rangeToggle').addEventListener('click', e => {
  const btn = e.target.closest('button[data-range]');
  if (!btn) return;
  currentRange = btn.dataset.range;
  document.querySelectorAll('.range-toggle button').forEach(b => b.classList.toggle('active', b === btn));
  renderAll();
});

const GAP = 8;
function layoutCards(){
  const grid = document.getElementById('grid');
  // reset to natural (CSS min-height) layout first, so row-wrapping reflects only width
  document.querySelectorAll('.card').forEach(c => c.style.height = '');
  void grid.offsetHeight; // force reflow

  const sections = [CEDEAR.map(i => i.sym), ON.map(i => i.sym)];
  const rowsPerSection = sections.map(syms => {
    const tops = new Set();
    syms.forEach(sym => {
      const el = document.getElementById('card-' + sym);
      if (el) tops.add(Math.round(el.getBoundingClientRect().top));
    });
    return Math.max(tops.size, 1);
  });
  const totalRows = rowsPerSection.reduce((a,b) => a+b, 0);

  let tagsHeight = 0;
  document.querySelectorAll('.sectiontag').forEach(el => tagsHeight += el.getBoundingClientRect().height + GAP);

  const availableHeight = grid.getBoundingClientRect().height;
  const rowGaps = GAP * (totalRows - 1 + (sections.length - 1)); // gaps between rows + one extra between sections
  const usable = availableHeight - tagsHeight - rowGaps - 4; // small safety margin, avoid triggering a scrollbar
  let cardHeight = usable / totalRows;
  cardHeight = Math.max(cardHeight, 92);

  document.querySelectorAll('.card').forEach(c => c.style.height = cardHeight + 'px');
}

// While the window is actively being dragged, there's always a gap between the browser resizing the
// box and our JS redrawing the chart for the new size — in that gap the old SVG just gets CSS-stretched
// to the new box, which looks "deformed". Instead of trying to close that gap to zero, we hide the
// chart the instant a resize starts and fade it back in only once things are redrawn and settled.
let resizeQueued = false;
let settleTimer;
let lastGridW = 0, lastGridH = 0;
function onGridResize(entries){
  // layoutCards() itself changes the grid's children, which can nudge the grid's own box by a
  // sub-pixel amount and re-trigger the observer — without this guard that becomes an infinite loop
  // (measured: 8 callbacks/2s with zero user interaction). Ignore anything under 1px of real change.
  if (entries && entries[0]){
    const {width, height} = entries[0].contentRect;
    if (Math.abs(width - lastGridW) < 1 && Math.abs(height - lastGridH) < 1) return;
    lastGridW = width; lastGridH = height;
  }
  document.body.classList.add('resizing'); // hide instantly, no transition — before any stretched frame paints
  clearTimeout(settleTimer);
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    layoutCards(); cardDims = {}; renderAll();
    settleTimer = setTimeout(() => document.body.classList.remove('resizing'), 120);
  });
}
if (window.ResizeObserver){
  new ResizeObserver(onGridResize).observe(document.getElementById('grid'));
} else {
  window.addEventListener('resize', onGridResize); // very old browsers
}

buildGrid();
layoutCards();
fetchHistory();
fetchLive();
setInterval(fetchLive, 30000);
setInterval(fetchHistory, 300000);
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => { layoutCards(); cardDims = {}; renderAll(); });
}
</script>
</body>
</html>
