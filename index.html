<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulso del Mercado — en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light dark;
    --bg:#F1F3F5; --surface:#FFFFFF; --surface-2:#E9EDF1;
    --ink:#1B2430; --ink-muted:#5B6672; --ink-faint:#8A94A0; --border:#D8DEE4;
    --up:#1E8F5C; --down:#B5562D; --accent:#3468A8; --accent-bg:#E6EEF6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181D; --surface:#1C222A; --surface-2:#232B34;
      --ink:#E7ECF1; --ink-muted:#9AA7B4; --ink-faint:#71808E; --border:#2C3540;
      --up:#2FA876; --down:#D97A52; --accent:#4A8BCB; --accent-bg:#213247;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Public Sans', system-ui, sans-serif;
    padding:16px 16px 28px; display:flex; flex-direction:column; gap:14px}
  h1{font-family:'Fraunces', Georgia, serif; font-size:1.25rem; font-weight:600; margin:0}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
  .titlewrap{display:flex; flex-direction:column; gap:3px}
  .asof{font-size:.72rem; color:var(--ink-faint); display:flex; align-items:center; gap:6px}
  .dot-live{width:6px;height:6px;border-radius:50%;background:var(--up);animation:pulse 2s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){.dot-live{animation:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .range-toggle{display:flex; gap:2px; background:var(--border); border-radius:9px; padding:2px}
  .range-toggle button{border:none; background:transparent; color:var(--ink-muted); font-family:'Public Sans',sans-serif;
    font-size:.82rem; font-weight:600; padding:7px 16px; border-radius:7px; cursor:pointer}
  .range-toggle button.active{background:var(--surface); color:var(--ink)}
  .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:10px; flex:1}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px 8px; display:flex; flex-direction:column; min-height:150px}
  .card .hd{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
  .tk{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.92rem}
  .nm{font-size:.62rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em}
  .px{font-family:'IBM Plex Mono',monospace; font-size:.8rem; font-weight:600}
  .chg{font-family:'IBM Plex Mono',monospace; font-size:.76rem; font-weight:600}
  .chg.up{color:var(--up)} .chg.down{color:var(--down)}
  .chartwrap{flex:1; min-height:70px}
  svg{width:100%; height:100%; display:block; overflow:visible}
  .note{font-size:.62rem; color:var(--ink-faint); font-style:italic}
  .sectiontag{font-size:.66rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); grid-column:1/-1; margin-top:6px}
  .sectiontag:first-child{margin-top:0}
  footer{font-size:.68rem; color:var(--ink-faint); display:flex; gap:14px; flex-wrap:wrap}
  footer a{color:var(--ink-muted)}
</style>
</head>
<body>

  <div class="topbar">
    <div class="titlewrap">
      <h1>Pulso del mercado</h1>
      <div class="asof"><span class="dot-live"></span><span id="asof">cargando…</span></div>
    </div>
    <div class="range-toggle" id="rangeToggle">
      <button data-range="diario" class="active">Diario</button>
      <button data-range="mensual">Mensual</button>
      <button data-range="anual">Anual</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <span>Fuente: <a href="https://data912.com">data912.com</a> (API pública)</span>
    <span>Precio actual se refresca cada 30s</span>
    <span>ON: sin historia gratuita disponible — el gráfico se arma solo, día a día, desde hoy</span>
    <span><a href="https://github.com/TomiJerez/pulso-mercado">código fuente</a></span>
  </footer>

<script>
const CEDEAR = [
  {sym:'MELI', tk:'MELI', nm:''},
  {sym:'NVDA', tk:'NVDA', nm:''},
  {sym:'AMD',  tk:'AMD',  nm:''},
  {sym:'TSLA', tk:'TSLA', nm:'plan B'},
  {sym:'META', tk:'META', nm:'plan B'},
  {sym:'AMZN', tk:'AMZN', nm:'plan B'},
];
const ON = [
  {sym:'YMCXD', tk:'YMCX', nm:'YPF'},
  {sym:'VSCTD', tk:'VSCT', nm:'Vista Energy'},
  {sym:'TSC4D', tk:'TSC4', nm:'TGS'},
  {sym:'BACHD', tk:'BACH', nm:'Banco Macro'},
  {sym:'MGCOD', tk:'MGCO', nm:'Pampa · plan B'},
  {sym:'BYCHD', tk:'BYCH', nm:'Galicia · plan B'},
];
const RANGE_DAYS = { diario: 30, mensual: 180, anual: 365 };
let currentRange = 'diario';
let cedearHistory = {};   // sym -> [{date, c}]
let onLocalSeries = {};   // sym -> [{date, c}]  (built via localStorage, from today onward)
let liveQuotes = {};      // sym -> current quote

function buildGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  grid.insertAdjacentHTML('beforeend', '<div class="sectiontag">Trading activo · CEDEARs</div>');
  CEDEAR.forEach(item => grid.insertAdjacentHTML('beforeend', cardHTML(item)));
  grid.insertAdjacentHTML('beforeend', '<div class="sectiontag">Núcleo dolarizado · ON</div>');
  ON.forEach(item => grid.insertAdjacentHTML('beforeend', cardHTML(item)));
}
function cardHTML(item){
  return `<div class="card" id="card-${item.sym}">
    <div class="hd">
      <span class="tk">${item.tk}<div class="nm">${item.nm}</div></span>
      <div style="text-align:right">
        <div class="px" id="px-${item.sym}">—</div>
        <div class="chg" id="chg-${item.sym}">—</div>
      </div>
    </div>
    <div class="chartwrap" id="chart-${item.sym}"></div>
  </div>`;
}

function lineSVG(points, w, h){
  if (!points || points.length < 2) return `<svg viewBox="0 0 ${w} ${h}"><text x="${w/2}" y="${h/2}" text-anchor="middle" font-size="10" fill="var(--ink-faint)">sin datos suficientes</text></svg>`;
  const vals = points.map(p => p.c);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max){ min -= 1; max += 1; }
  const padY = (max - min) * 0.12;
  min -= padY; max += padY;
  const padL = 4, padR = 4, padT = 6, padB = 6;
  const iw = w - padL - padR, ih = h - padT - padB;
  const x = i => padL + (i / (points.length - 1)) * iw;
  const y = v => padT + ih - ((v - min) / (max - min)) * ih;
  const first = points[0].c, last = points[points.length-1].c;
  const up = last >= first;
  const color = up ? 'var(--up)' : 'var(--down)';
  let d = points.map((p,i) => `${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.c).toFixed(1)}`).join(' ');
  const areaD = d + ` L${x(points.length-1).toFixed(1)},${(padT+ih).toFixed(1)} L${x(0).toFixed(1)},${(padT+ih).toFixed(1)} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="${padL}" y1="${padT+ih}" x2="${w-padR}" y2="${padT+ih}" stroke="var(--border)" stroke-width="1"/>
    <path d="${areaD}" fill="${color}" fill-opacity="0.08" stroke="none"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(points.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="2.5" fill="${color}"/>
  </svg>`;
}

function renderChart(sym, series){
  const el = document.getElementById('chart-' + sym);
  if (!el) return;
  const rect = el.getBoundingClientRect();
  const w = Math.max(rect.width, 100), h = Math.max(rect.height, 60);
  const days = RANGE_DAYS[currentRange];
  const slice = series.slice(-days);
  el.innerHTML = lineSVG(slice, w, h);
}

function renderAll(){
  CEDEAR.forEach(item => renderChart(item.sym, cedearHistory[item.sym] || []));
  ON.forEach(item => renderChart(item.sym, onLocalSeries[item.sym] || []));
}

function updateLiveLabels(){
  [...CEDEAR, ...ON].forEach(item => {
    const q = liveQuotes[item.sym];
    const pxEl = document.getElementById('px-' + item.sym);
    const chgEl = document.getElementById('chg-' + item.sym);
    if (!q || !pxEl) return;
    pxEl.textContent = '$' + Math.round(q.c).toLocaleString('es-AR');
    const pct = q.pct_change ?? 0;
    chgEl.textContent = (pct>=0?'+':'−') + Math.abs(pct).toFixed(2) + '%';
    chgEl.className = 'chg ' + (pct>=0?'up':'down');
  });
}

// ON: build a local, growing history in localStorage since no free API has it
function updateOnLocalSeries(){
  const todayKey = new Date().toISOString().slice(0,10);
  ON.forEach(item => {
    const q = liveQuotes[item.sym];
    if (!q) return;
    const storeKey = 'pulso_on_' + item.sym;
    let series = JSON.parse(localStorage.getItem(storeKey) || '[]');
    const last = series[series.length - 1];
    if (last && last.date === todayKey){
      last.c = q.c; // update today's point
    } else {
      series.push({date: todayKey, c: q.c});
    }
    if (series.length > 400) series = series.slice(-400);
    localStorage.setItem(storeKey, JSON.stringify(series));
    onLocalSeries[item.sym] = series;
  });
}

async function fetchLive(){
  try{
    const [corpRes, cedRes] = await Promise.all([
      fetch('https://data912.com/live/arg_corp'),
      fetch('https://data912.com/live/arg_cedears')
    ]);
    const corp = await corpRes.json();
    const ced = await cedRes.json();
    liveQuotes = {};
    [...corp, ...ced].forEach(q => liveQuotes[q.symbol] = q);
    updateOnLocalSeries();
    updateLiveLabels();
    renderAll();
    document.getElementById('asof').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR');
  }catch(e){
    document.getElementById('asof').textContent = 'Error al actualizar — reintentando…';
  }
}

async function fetchHistory(){
  await Promise.all(CEDEAR.map(async item => {
    try{
      const res = await fetch('https://data912.com/historical/cedears/' + item.sym);
      const data = await res.json();
      cedearHistory[item.sym] = data.map(d => ({date: d.date, c: d.c}));
    }catch(e){ cedearHistory[item.sym] = []; }
  }));
  ON.forEach(item => {
    onLocalSeries[item.sym] = JSON.parse(localStorage.getItem('pulso_on_' + item.sym) || '[]');
  });
  renderAll();
}

document.getElementById('rangeToggle').addEventListener('click', e => {
  const btn = e.target.closest('button[data-range]');
  if (!btn) return;
  currentRange = btn.dataset.range;
  document.querySelectorAll('.range-toggle button').forEach(b => b.classList.toggle('active', b === btn));
  renderAll();
});
window.addEventListener('resize', () => renderAll());

buildGrid();
fetchHistory();
fetchLive();
setInterval(fetchLive, 30000);
setInterval(fetchHistory, 300000);
</script>
</body>
</html>
